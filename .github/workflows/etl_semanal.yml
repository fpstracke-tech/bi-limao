name: ETL Semanal — Preços

on:
  # ======================================================================
  # GATILHO PRIMÁRIO (01/09/2026): pg_cron do Supabase, projeto "TI Tradeconnex",
  # job `limao-semanal` às 08:39 UTC de segunda → POST em /dispatches via pg_net.
  #
  # Por que saímos do cron do GitHub: ele é best-effort e, neste repo, deixou de
  # ser utilizável. Medição pela REST API do Actions (campo created_at do run):
  #   21-26/08  atraso de 16-40 min  (normal)
  #   27/08     +10h29     28/08  +11h44
  #   29/08     +5h27      30/08  +5h24
  #   31/08     evento DESCARTADO — nenhum run agendado, relatório não saiu
  #   01/09     evento DESCARTADO
  # Os horários reais de disparo caíam sempre na mesma janela (13:24-13:28, ou
  # 18:30-19:50) INDEPENDENTE do minuto configurado — ou seja, não é contenção
  # de minuto cheio, é varredura em lote de fila de baixa prioridade. Prova:
  # o bi-avocado, mesma conta, com crons em minuto CHEIO, rodou em 31/08.
  # Descartados: billing (repo público = minutos ilimitados), workflow disabled
  # (todos active), default branch (main), inatividade de 60 dias (commit
  # diário), incidente aberto (status page operacional).
  #
  # A troca de minuto cheio → quebrado feita em 31/08 (commit 9073821) não
  # resolveu nada. Mantida só porque não custa.
  # ======================================================================
  repository_dispatch:
    types: [etl-semanal]
  # Redundância — upsert idempotente nos 3 scrapers. Se o cron atrasado do
  # GitHub cair horas depois, regrava o mesmo dado sem efeito colateral: o
  # relatório NÃO segue runs de `schedule` (ver filtro em etl_relatorio.yml),
  # justamente para não enviar o PDF duas vezes.
  schedule:
    # Minuto 39, não 0 (31/08/2026): o início da hora é o slot de maior contenção
    # no agendador do GitHub — cron em minuto cheio é atrasado ou descartado. Em
    # 31/08 os três crons das 8h UTC (este, containers e clima global) foram
    # pulados juntos, ninguém rodou e o relatório semanal não saiu.
    # Os minutos dos 5 workflows são espaçados de propósito: clima global 13,
    # clima local 19, containers 26, este 39, mensal 22 (10h UTC). Não realinhar.
    - cron: '39 8 * * 1'   # Toda segunda-feira às 05:39 BRT (08:39 UTC)
  workflow_dispatch:
    inputs:
      skip:
        description: 'ETLs para pular (ex: aschenberg europa)'
        required: false
        default: ''

jobs:
  etl-precos:
    name: Preços Brasil + Chile + México + Colômbia + Peru + Europa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
      contents: read

    env:
      SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
      HF_API_KEY:       ${{ secrets.HF_API_KEY }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: ETL Preços Brasil (HF Brasil)
        id: brasil
        run: python etl_hfbrasil.py

      # !cancelled(): uma fonte falhar não pode pular as outras
      # (03/08/2026: 403 do HF Brasil derrubou Chile e Europa juntos)
      - name: ETL Preços Chile (ODEPA)
        id: chile
        if: ${{ !cancelled() }}
        run: python pipeline_odepa_limon.py

      # México e Colômbia antes do Playwright: os dois ETLs só usam requests,
      # então uma falha na instalação do browser (que é só da Europa) não pode
      # levá-los junto.
      - name: ETL Preços México (SNIIM)
        id: mexico
        if: ${{ !cancelled() }}
        run: python etl_mexico_sniim.py


      - name: ETL Preços Colômbia (SIPSA/DANE)
        id: colombia
        if: ${{ !cancelled() }}
        run: python etl_colombia_sipsa.py

      - name: ETL Preços Peru (EMMSA)
        id: peru
        if: ${{ !cancelled() }}
        run: python etl_peru_emmsa.py

      - name: Instalar Playwright (necessário para Europa)
        if: ${{ !cancelled() }}
        run: playwright install --with-deps chromium

      - name: ETL Preços Europa (FranceAgriMer)
        id: europa
        if: ${{ !cancelled() }}
        run: python etl_europa_franceagrimer.py

      - name: Resumo Preços
        if: always()
        run: |
          echo "Brasil:   ${{ steps.brasil.outcome }}"
          echo "Chile:    ${{ steps.chile.outcome }}"
          echo "México:   ${{ steps.mexico.outcome }}"
          echo "Colômbia: ${{ steps.colombia.outcome }}"
          echo "Peru:     ${{ steps.peru.outcome }}"
          echo "Europa:   ${{ steps.europa.outcome }}"

      - name: Abrir issue em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const steps = {
              Brasil:  '${{ steps.brasil.outcome }}',
              Chile:   '${{ steps.chile.outcome }}',
              Mexico:   '${{ steps.mexico.outcome }}',
              Colombia: '${{ steps.colombia.outcome }}',
              Peru:     '${{ steps.peru.outcome }}',
              Europa:  '${{ steps.europa.outcome }}',
            };
            const failed = Object.entries(steps).filter(([,v]) => v === 'failure').map(([k]) => k);
            const title = `❌ Falha ETL Preços — ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`;
            const body = [
              `**ETLs com falha:** ${failed.join(', ')}`,
              `**Workflow:** ${context.workflow}`,
              `**Run:** ${context.runId}`,
              `**Link:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Verifique os logs acima para identificar o problema.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['etl-falha', 'precos'],
            });
