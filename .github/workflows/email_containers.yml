name: E-mail Containers — semanal

# Resumo semanal de chegadas de containers (Brasil para Europa e UK) para o
# time comercial. Criado em 06/11/2026, substitui a página de imagem
# "Containers Limão" do Power BI.
#
# ENTREGA: toda SEGUNDA às 07:30 BRT (pedido do Felipe, 06/11/2026).
# O cron do GitHub não garante horário (atrasos de horas e runs pulados, ver
# etl_semanal.yml), então o horário fica com o RESEND:
#   - DOMINGO: quando o "ETL Containers — diário" termina com sucesso, o e-mail
#     é montado com a semana que fecha no domingo e AGENDADO no Resend
#     (scheduled_at) para segunda 07:30. Folga de um dia inteiro para o cron.
#   - SEGUNDA: rede de segurança. Se o run de domingo não aconteceu, envia
#     assim que o ETL de segunda terminar (atrasado, mas não pula a semana).
#   - Outros dias: não faz nada.
# Idempotência: marcador no cache do Actions por semana ISO; o ETL pode rodar
# mais de uma vez por dia e a segunda não reenvia o que o domingo agendou.
#
# Remetente reports@tfruits.com.br: o domínio está verificado em OUTRA conta
# Resend, por isso a chave é RESEND_API_KEY_TFRUITS (não a RESEND_API_KEY do
# relatório antigo, que é da conta tradeconnex.com).

on:
  workflow_run:
    workflows: ["ETL Containers — diário"]
    types: [completed]
  workflow_dispatch:
    inputs:
      email_to:
        description: "Enviar só para (teste, separar por vírgula). Vazio = destinatários oficiais"
        required: false
        default: ""
      forcar:
        description: "Enviar mesmo que já tenha saído nesta semana"
        type: boolean
        default: false

jobs:
  email:
    name: Enviar e-mail de containers
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read

    env:
      SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:           ${{ secrets.SUPABASE_KEY }}
      RESEND_API_KEY_TFRUITS: ${{ secrets.RESEND_API_KEY_TFRUITS }}
      EMAIL_TO:               ${{ github.event.inputs.email_to }}
      PYTHONIOENCODING:       utf-8

    steps:
      - name: Qual dia (BRT) e qual semana
        id: quando
        run: |
          DIA=$(TZ=America/Sao_Paulo date +%u)
          ENVIO_EM=""
          if [ "$DIA" = "7" ]; then
            SEMANA=$(TZ=America/Sao_Paulo date +%G-W%V)
            ENVIO_EM="$(TZ=America/Sao_Paulo date -d tomorrow +%Y-%m-%d)T07:30:00-03:00"
          else
            # Na segunda, "7 dias atrás" cai na segunda da semana fechada.
            SEMANA=$(TZ=America/Sao_Paulo date -d '7 days ago' +%G-W%V)
          fi
          echo "dia=$DIA" >> "$GITHUB_OUTPUT"
          echo "semana=$SEMANA" >> "$GITHUB_OUTPUT"
          echo "envio_em=$ENVIO_EM" >> "$GITHUB_OUTPUT"
          echo "Dia BRT: $DIA | semana: $SEMANA | agendar para: ${ENVIO_EM:-agora}"

      - name: Já enviado ou agendado nesta semana?
        id: marcador
        if: github.event_name == 'workflow_run' && (steps.quando.outputs.dia == '7' || steps.quando.outputs.dia == '1')
        uses: actions/cache/restore@v4
        with:
          path: .email_containers_enviado
          key: email-containers-${{ steps.quando.outputs.semana }}
          lookup-only: true

      - name: Decidir se envia
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enviar=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.quando.outputs.dia }}" != "7" ] && [ "${{ steps.quando.outputs.dia }}" != "1" ]; then
            echo "Não é domingo nem segunda em Brasília, nada a fazer."
            echo "enviar=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.marcador.outputs.cache-hit }}" = "true" ]; then
            echo "E-mail da semana ${{ steps.quando.outputs.semana }} já foi enviado ou agendado."
            echo "enviar=false" >> "$GITHUB_OUTPUT"
          else
            echo "enviar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.decide.outputs.enviar == 'true'
        uses: actions/checkout@v4

      - name: Python 3.11
        if: steps.decide.outputs.enviar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        if: steps.decide.outputs.enviar == 'true'
        run: pip install requests

      - name: Gerar e enviar
        if: steps.decide.outputs.enviar == 'true'
        env:
          # Teste manual envia na hora; o agendamento é só do fluxo automático.
          ENVIO_EM: ${{ github.event_name == 'workflow_run' && steps.quando.outputs.envio_em || '' }}
        run: python email_containers.py

      - name: Gravar marcador de envio
        if: steps.decide.outputs.enviar == 'true' && github.event_name == 'workflow_run'
        run: echo "${{ steps.quando.outputs.semana }}" > .email_containers_enviado

      - name: Salvar marcador
        if: steps.decide.outputs.enviar == 'true' && github.event_name == 'workflow_run'
        uses: actions/cache/save@v4
        with:
          path: .email_containers_enviado
          key: email-containers-${{ steps.quando.outputs.semana }}

      - name: Abrir issue em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Falha no e-mail de containers ${new Date().toISOString().slice(0,10)}`,
              body: [
                `**Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Causas prováveis: semana fechada sem dado no banco (ETL ainda não pegou),',
                'ou RESEND_API_KEY_TFRUITS inválida / domínio tfruits.com.br não verificado.',
                'Reenvio manual: Actions > E-mail Containers — semanal > Run workflow.',
              ].join('\n'),
              labels: ['etl-falha', 'containers'],
            });
