name: ETL Relatório Semanal — Email PDF

# Encadeado por DEPENDÊNCIA, não por relógio (03/08/2026): o cron '0 10 * * 1'
# foi pulado pelo GitHub (skip em minuto cheio sob carga) e os crons das 8h UTC
# atrasaram ~3h10 — a folga de 2h entre ETLs e relatório não é garantia.
# Agora o relatório dispara quando o "ETL Semanal — Preços" termina: se o cron
# atrasar, tudo desliza junto na ordem certa; se o ETL falhar, o relatório não
# sai com dado velho (a issue de falha do ETL já avisa).
# O ETL Semanal é o mais longo do lote das 8h UTC (3 scrapers + playwright),
# então containers/clima do mesmo lote terminam antes dele.

on:
  workflow_run:
    workflows: ["ETL Semanal — Preços"]
    types: [completed]
  workflow_dispatch:

jobs:
  relatorio:
    name: Gerar e Enviar Relatório PDF
    # Segue apenas o run do ETL Semanal disparado pelo AGENDADOR e com sucesso —
    # re-runs manuais do ETL (ex.: correção no meio da semana) não reenviam o
    # relatório. Reenvio manual: workflow_dispatch deste workflow.
    #
    # 01/09/2026: o gatilho do agendador passou de `schedule` (cron do GitHub,
    # que virou inutilizável — ver etl_semanal.yml) para `repository_dispatch`
    # (pg_cron do Supabase). O filtro aceita SÓ repository_dispatch de propósito:
    # o cron do GitHub continua ligado como redundância de DADO no etl_semanal, e
    # se aceitasse `schedule` também o PDF sairia duas vezes na segunda.
    # Consequência assumida: se o pg_cron falhar e só o cron do GitHub rodar, os
    # preços entram mas o relatório não sai — o monitor das 08h30 BRT detecta e
    # o reenvio é um workflow_dispatch daqui.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'repository_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read

    env:
      SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
      RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências Python
        run: pip install --upgrade pip && pip install requests Pillow playwright

      - name: Instalar Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Gerar PDF e Enviar Email
        id: relatorio
        run: python etl_relatorio_semanal.py

      - name: Resumo
        if: always()
        run: echo "Relatório ${{ steps.relatorio.outcome }} — $(date -u '+%Y-%m-%d %H%M UTC')"

      - name: Abrir issue em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `❌ Falha Relatório Semanal — ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`;
            const body = [
              `**Workflow:** ${context.workflow}`,
              `**Run:** ${context.runId}`,
              `**Link:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Possível causa: falha Resend API, Supabase fora do ar, ou erro de geração do PDF.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['etl-falha', 'relatorio'],
            });
