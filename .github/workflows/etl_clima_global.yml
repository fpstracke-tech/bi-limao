name: ETL Clima Global — diário

# Roda TODOS OS DIAS porque a OpenWeatherMap (plano gratuito) entrega apenas
# 5 dias de previsão: com coleta semanal, na quinta sobravam 3 dias e no domingo
# a página ficava sem previsão futura.
# Cota OWM: 9 cidades = 9 chamadas/dia, folga larga no plano gratuito.
# Separado do Clima Local de propósito — a HG Brasil só permite 10 req/dia.

on:
  schedule:
    # Minuto 13, não 0 — ver justificativa completa em etl_semanal.yml
    # (minuto cheio é o slot de maior contenção; em 31/08/2026 os três crons
    # das 8h UTC foram pulados juntos). Espaçamento: global 13, local 19,
    # containers 26, semanal 39, mensal 22 (10h UTC).
    - cron: '13 8 * * *'   # Todos os dias às 05:13 BRT (08:13 UTC)
  workflow_dispatch:

jobs:
  etl-clima-global:
    name: Clima Global (OpenWeatherMap)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read

    env:
      SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
      OWM_API_KEY:      ${{ secrets.OWM_API_KEY }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: ETL Clima Global (OpenWeatherMap)
        id: clima_global
        run: python etl_clima_openweather.py

      - name: Resumo
        if: always()
        run: |
          echo "### Resultado ETL Clima Global — $(date -u '+%Y-%m-%d %H%M UTC')"
          echo "Clima Global: ${{ steps.clima_global.outcome }}"

      - name: Abrir issue em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `❌ Falha ETL Clima Global — ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`;
            const body = [
              `**Workflow:** ${context.workflow}`,
              `**Run:** ${context.runId}`,
              `**Link:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Verifique os logs acima para identificar o problema.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['etl-falha', 'clima'],
            });
