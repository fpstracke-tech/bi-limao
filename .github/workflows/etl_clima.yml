name: ETL Clima Local — seg/qua/sex

# Seg/qua/sex, não diário: a HG Brasil (plano gratuito) permite 10 requisições/dia
# por chave e monitoramos 8 cidades. Diário consumiria 8 das 10 e sobrariam só 2
# tentativas em caso de falha. Nessa cadência o dado nunca passa de 2 dias e a
# cota do dia fica inteira para re-run manual.
# Não há prejuízo: a HG Brasil devolve 15 dias de previsão, então a coleta
# semanal ainda deixa 8+ dias à frente no gráfico.
# O Clima Global roda diariamente em etl_clima_global.yml (limite da OWM é 5 dias).

on:
  # GATILHO PRIMÁRIO (01/09/2026): pg_cron do Supabase "TI Tradeconnex", job
  # limao-clima-local, 08:19 UTC seg/qua/sex. Ver justificativa em etl_semanal.yml.
  repository_dispatch:
    types: [etl-clima-local]
  # REDE DE SEGURANÇA (07/10/2026): o pg_cron está parado — o projeto Supabase
  # "TI Tradeconnex" (cpmetvowdtqubehvueni) está INACTIVE e não responde, e o
  # secret github_pat_actions nunca foi criado no Vault. Sem este schedule o
  # Clima Local fica SEM NENHUM gatilho e simplesmente para de coletar.
  # Quando o pg_cron voltar e um dispatch devolver 204, REMOVER este bloco:
  # com os dois ativos o run dobra e estoura a cota da HG Brasil (10 req/dia,
  # 8 por run), que é a razão original de ele não ter schedule.
  schedule:
    - cron: '19 8 * * 1,3,5'   # seg/qua/sex 05:19 BRT (08:19 UTC)
  # SEM bloco `schedule` de propósito — é o único ETL do repo onde rodar duas
  # vezes no mesmo dia é nocivo: a HG Brasil grátis dá 10 req/dia por chave e
  # cada run consome 8. Se o cron atrasado do GitHub caísse depois do
  # repository_dispatch, o segundo run estouraria a cota e abriria issue de
  # falha sem que nada estivesse errado. Aqui o pg_cron é gatilho único
  # (job limao-clima-local, 08:19 UTC seg/qua/sex); a rede de segurança é o
  # monitor das 08h30 BRT + workflow_dispatch manual.
  workflow_dispatch:
    inputs:
      debug:
        description: 'Ativar output verboso'
        required: false
        default: 'false'

jobs:
  etl-clima-local:
    name: Clima Local (HG Brasil)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      contents: read

    env:
      SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
      HG_API_KEY:       ${{ secrets.HG_API_KEY }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: ETL Clima Local (HG Brasil)
        id: clima_local
        run: python etl_clima_brasil.py

      - name: Resumo
        if: always()
        run: |
          echo "### Resultado ETL Clima Local — $(date -u '+%Y-%m-%d %H%M UTC')"
          echo "Clima Local: ${{ steps.clima_local.outcome }}"

      - name: Abrir issue em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `❌ Falha ETL Clima Local — ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`;
            const body = [
              `**Workflow:** ${context.workflow}`,
              `**Run:** ${context.runId}`,
              `**Link:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Verifique os logs acima para identificar o problema.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['etl-falha', 'clima'],
            });
