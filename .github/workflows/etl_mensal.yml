name: ETL Mensal — Comexstat

on:
  schedule:
    # Janela de retry: dias 10 a 20 às 07:00 BRT (10:00 UTC).
    # O script detecta se o mês alvo já está no banco e encerra sem coletar;
    # se a fonte ainda não publicou, tenta de novo no dia seguinte.
    - cron: '0 10 10-20 * *'
  workflow_dispatch:

jobs:
  etl-comexstat:
    name: Share Brasil (Comexstat MDIC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      contents: read

    env:
      SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: ETL Comexstat
        id: comexstat
        env:
          # Disparo manual ignora o "mês já no banco" e força coleta completa
          COMEXSTAT_FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python etl_comexstat.py

      - name: Resumo
        if: always()
        run: echo "Comexstat ${{ steps.comexstat.outcome }} — $(date -u '+%Y-%m-%d %H%M UTC')"

      - name: Abrir issue em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `❌ Falha ETL Comexstat — ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`;
            const body = [
              `**Workflow:** ${context.workflow}`,
              `**Run:** ${context.runId}`,
              `**Link:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Possível causa: API Comexstat fora do ar ou mudança de endpoint.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['etl-falha', 'comexstat'],
            });
